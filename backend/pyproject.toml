[project]
name = "mock-ai-backend"
version = "0.1.0"
description = "AI mock interviewer backend"
authors = [
    { name = "anilnandhan", email = "anilkumarwork42@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "groq>=1.7.0",
    "kokoro-onnx>=0.6.1",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
